<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎬 MyVideoApp - 短视频社交平台</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
</head>
<body>
<!-- 顶部导航 -->
<nav class="topbar">
  <div class="logo">🎬 <span>MyVideoApp</span></div>
  <div class="nav-actions">
    <button class="btn-icon" id="btn-home" title="首页">🏠</button>
    <button class="btn-icon" id="btn-explore" title="发现">🔍</button>
    <button class="btn-icon" id="btn-live" title="直播">📡</button>
    <button class="btn-icon" id="btn-msg" title="消息">💬<span class="badge" id="msg-badge" hidden></span></button>
    <button class="btn-icon" id="btn-notify" title="通知">🔔<span class="badge" id="notify-badge" hidden></span></button>
    <button class="btn-primary" id="btn-upload">＋发布</button>
    <div class="avatar-wrap" id="avatar-wrap"><div class="avatar" id="nav-avatar">😊</div></div>
  </div>
</nav>

<!-- 登录/注册弹窗 -->
<div class="modal" id="modal-auth" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <div class="auth-tabs">
      <button class="tab active" data-tab="login">登录</button>
      <button class="tab" data-tab="register">注册</button>
    </div>
    <div class="tab-panel" id="panel-login">
      <input class="input" type="tel" id="login-phone" placeholder="手机号">
      <input class="input" type="password" id="login-pwd" placeholder="密码">
      <button class="btn-primary block" id="do-login">登录</button>
      <div class="divider"><span>第三方登录</span></div>
      <div class="oauth">
        <button class="oauth-btn wechat" id="oauth-wechat">💬 微信登录</button>
        <button class="oauth-btn qq" id="oauth-qq">🐧 QQ登录</button>
      </div>
    </div>
    <div class="tab-panel" id="panel-register" hidden>
      <input class="input" type="tel" id="reg-phone" placeholder="手机号">
      <input class="input" type="password" id="reg-pwd" placeholder="密码（6位以上）">
      <input class="input" type="text" id="reg-nick" placeholder="昵称（可选）">
      <button class="btn-primary block" id="do-register">注册</button>
    </div>
  </div>
</div>

<!-- 发布视频弹窗 -->
<div class="modal" id="modal-upload" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <h3>发布视频</h3>
    <input class="input" type="text" id="up-title" placeholder="视频标题">
    <input class="input" type="url" id="up-url" placeholder="视频地址（MP4 直链）">
    <input class="input" type="url" id="up-cover" placeholder="封面图地址（可选）">
    <p class="tip">💡 提示：可填写任意 .mp4 直链地址，如 https://www.w3schools.com/html/mov_bbb.mp4</p>
    <button class="btn-primary block" id="do-upload">发布</button>
  </div>
</div>

<!-- 个人主页弹窗 -->
<div class="modal" id="modal-profile" hidden>
  <div class="modal-box large">
    <button class="modal-close" data-close>×</button>
    <div class="profile-head">
      <div class="avatar big" id="profile-avatar">😊</div>
      <div>
        <h3 id="profile-nick">--</h3>
        <p class="muted" id="profile-bio">--</p>
        <div class="profile-stats"><span id="profile-followers">0</span> 粉丝 · <span id="profile-following">0</span> 关注</div>
      </div>
    </div>
    <div class="profile-edit">
      <h4>编辑资料</h4>
      <input class="input" type="text" id="edit-nick" placeholder="昵称">
      <input class="input" type="url" id="edit-avatar" placeholder="头像 URL">
      <textarea class="input" id="edit-bio" placeholder="个人简介" rows="2"></textarea>
      <button class="btn-primary block" id="do-save-profile">保存修改</button>
    </div>
    <div class="profile-videos">
      <h4>我的视频</h4>
      <div class="video-grid" id="profile-videos"></div>
    </div>
  </div>
</div>

<!-- 直播间弹窗 -->
<div class="modal" id="modal-live" hidden>
  <div class="modal-box large">
    <button class="modal-close" data-close>×</button>
    <div class="live-room" id="live-room">
      <video id="live-video" autoplay playsinline muted></video>
      <div class="live-info"><span class="live-tag">LIVE</span><span id="live-title">直播间</span></div>
      <div class="live-chat" id="live-chat"></div>
      <div class="live-input"><input class="input" id="live-msg" placeholder="说点什么..."><button class="btn-primary" id="live-send">发送</button></div>
    </div>
  </div>
</div>

<!-- 直播列表弹窗 -->
<div class="modal" id="modal-livelist" hidden>
  <div class="modal-box large">
    <button class="modal-close" data-close>×</button>
    <div class="live-header">
      <h3>📡 直播广场</h3>
      <button class="btn-primary" id="btn-start-live">＋ 开直播</button>
    </div>
    <div class="live-list" id="live-list"></div>
  </div>
</div>

<!-- 开直播弹窗 -->
<div class="modal" id="modal-startlive" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <h3>开启直播</h3>
    <input class="input" type="text" id="startlive-title" placeholder="直播标题">
    <p class="tip">💡 将请求摄像头权限，直播通过 WebRTC 在本地预览。</p>
    <button class="btn-primary block" id="do-start-live">开始直播</button>
  </div>
</div>

<!-- 消息弹窗 -->
<div class="modal" id="modal-msg" hidden>
  <div class="modal-box large">
    <button class="modal-close" data-close>×</button>
    <div class="msg-layout">
      <div class="msg-side">
        <h4>会话</h4>
        <div class="conv-list" id="conv-list"></div>
        <h4>用户</h4>
        <div class="user-list" id="msg-userlist"></div>
      </div>
      <div class="msg-main">
        <div class="msg-top" id="msg-top">选择会话开始聊天</div>
        <div class="msg-list" id="msg-list"></div>
        <div class="msg-compose" id="msg-compose" hidden>
          <input class="input" id="msg-input" placeholder="输入消息...">
          <button class="btn-primary" id="msg-send">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 通知弹窗 -->
<div class="modal" id="modal-notify" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <h3>🔔 通知</h3>
    <div class="notify-list" id="notify-list"></div>
  </div>
</div>

<!-- 视频 Feed 主区 -->
<main class="feed" id="feed">
  <div class="feed-tip">⬇ 上下滑动刷视频 · 单击 ❤️ 点赞</div>
</main>

<!-- 底部播放器控制 -->
<div class="nowplaying" id="nowplaying" hidden>
  <div class="np-info"><span id="np-title">--</span></div>
  <div class="np-actions">
    <button id="np-like">❤️ <span id="np-likecnt">0</span></button>
    <button id="np-fav">⭐</button>
    <button id="np-comment">💬</button>
  </div>
</div>

<!-- 评论弹窗 -->
<div class="modal" id="modal-comment" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>×</button>
    <h3>💬 评论</h3>
    <div class="comment-list" id="comment-list"></div>
    <div class="comment-input"><input class="input" id="comment-input" placeholder="发表评论..."><button class="btn-primary" id="comment-send">发送</button></div>
  </div>
div>

<div class="toast" id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
